# 项目配置示例。实际 project.ini 由程序创建和维护。

[config]
# 项目配置结构版本。
schema_version = 3
document_type = project

[project]
# 人类可读项目名称，默认使用项目目录名。
name = example_hom_scan
# 可选说明，不参与运行身份计算。
description = HOM scan with fixed tetrahedral mesh

[paths]
# 相对路径以 project.ini 所在目录为基准。
result_dir = result
# Worker 协议文件、宏和工作副本目录。
temp_dir = temp

[cst]
# 经过预处理、供 Worker 打开的 CST 工程文件。
project_file = processed.cst
# 工程文件摘要，用于发现人工修改或损坏。
project_digest =
# 新项目固定为 sha256；旧项目迁移时可能为 md5。
digest_algorithm = sha256

[execution]
# 是否启用 MPI。当前本地 HOM 流程通常保持 False。
use_mpi = False
# MPI 节点列表；仅 use_mpi=True 时使用。
mpi_node_list =
# 是否使用 CST 远程计算服务。
use_remote = False
# 远程计算控制器地址；仅 use_remote=True 时使用。
controller_address =

[artifacts]
# CST 参数清单 JSON，相对项目目录。
parameters = params.json
# 后处理定义 JSON，相对项目目录。
postprocess = pps.json

[mesh]
# True 表示关闭四面体自适应网格，并使用固定密度。
fixed = True
# 每波长单元数，只能在新项目初始化前确定，必须为正整数。
cells_per_wavelength = 20

[task]
# READY/RUNNING/DONE/STOP_REQUESTED/INTERRUPTED/FAILED/RECOVERY_REQUIRED。
# 由生命周期管理器维护，不应在运行期间手工修改。
status = READY
