[config]
# 配置结构版本。由程序迁移和校验，不应手动降低。
schema_version = 3
# 文档类型，用于区分全局配置和项目配置。
document_type = global

[paths]
# CST 宏模板、默认后处理配置等只读资源目录。
data_dir = data
# 应用级临时文件目录；项目 Worker 使用项目自己的 temp_dir。
temp_dir = temp
# 应用日志目录。
log_dir = log
# 默认结果根目录；具体项目可定义独立结果目录。
result_dir = result

[cst]
# CST 主版本号，例如 2022。必须与 executable 指向的安装版本一致。
version =
# CST DESIGN ENVIRONMENT.exe 的完整路径；可由安装发现功能填写。
executable =

[project]
# 最近使用的项目目录。为空表示启动时不自动选择项目。
current_directory =

[superfish]
# 可选的 Poisson Superfish 安装目录；HOM/CST 流程不依赖此项。
directory =
# 可选的 Superfish 版本标识。
version =
