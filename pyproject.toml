[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cst-tools"
version = "0.1.0"
description = "CST automation and optimization tools"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "PyQt5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["csttool*", "algs*", "GUI*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-m \"not integration\" --strict-markers"
testpaths = ["test"]
markers = [
    "integration: requires a local CST installation and may start external processes",
]
